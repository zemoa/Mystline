name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libx11-dev libxdo-dev libxkbcommon-dev libwayland-dev librsvg2-dev patchelf pkg-config xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nsrc-tauri -> src-tauri/target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint
        if: runner.os == 'Linux'
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test
        if: runner.os == 'Linux'
        run: |
          cargo test --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          pnpm --dir frontend test

      - name: Build the application
        run: pnpm exec tauri build --no-bundle

  release:
    name: Release (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: --bundles deb,appimage
          - name: Windows
            os: windows-latest
            args: --bundles msi,nsis

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libx11-dev libxdo-dev libxkbcommon-dev libwayland-dev librsvg2-dev patchelf pkg-config xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nsrc-tauri -> src-tauri/target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Mystline ${{ github.ref_name }}
          releaseBody: Distribution packages for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
