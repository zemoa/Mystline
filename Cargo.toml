[package]
name = "mystline"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "x11", "wayland", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
thiserror = "2"
blake3 = "1"
tempfile = "3"
notify = "8"
futures = "0.3"
global-hotkey = "0.8"
fs2 = "0.4"
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["global_shortcuts"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
