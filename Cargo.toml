[package]
name = "mystline"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
thiserror = "2"
blake3 = "1"
tempfile = "3"
tokio = { version = "1", features = ["time", "rt", "sync"] }
tracing = "0.1"
global-hotkey = "0.8"

[dev-dependencies]
tempfile = "3"
