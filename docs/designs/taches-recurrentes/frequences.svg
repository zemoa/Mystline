<text x="596" y="603" class="label">31 oct. → 30 nov. → 31 déc.</text>
<text x="596" y="634" class="muted">Dernier jour si le 31 n’existe pas, puis retour au 31</text>
<text x="596" y="665" class="label">Commande : /r mois:31</text>
<text x="32" y="729" class="body">Commun aux quatre variantes : première date modifiable et aperçu avant enregistrement.</text>
<text x="32" y="760" class="muted">En édition : « Ne plus répéter » conserve la tâche à faire et ses dates comme tâche ponctuelle.</text>
