<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1140" viewBox="0 0 1360 1140"><rect width="1360" height="1140" fill="#edf0f5"/><g font-family="DejaVu Sans, sans-serif"><text x="44" y="40" font-size="12" fill="#4e54a5" font-weight="700" letter-spacing="1.4">MYSTLINE / MAQUETTE 01 / DIRECTION FONCTIONNELLE VALIDÉE</text><text x="44" y="84" font-size="30" fill="#293247" font-weight="700" >Sans date, une tâche est déjà en cours.</text><text x="44" y="117" font-size="16" fill="#68738a" font-weight="400" >Vue principale · le classement porte sur la date prévue ; la deadline reste une contrainte distincte.</text><rect x="44" y="160" width="620" height="916" rx="8" fill="#f5f7fb" stroke="#dce1eb"/><text x="68" y="197" font-size="24" fill="#4e54a5" font-weight="700" >☰</text><text x="103" y="196" font-size="18" fill="#293247" font-weight="650" >Mystline</text><text x="424" y="195" font-size="12" fill="#68738a" font-weight="400" >Recherche   Historique   Aide</text><text x="68" y="243" font-size="28" fill="#293247" font-weight="700" >Mes tâches</text><text x="68" y="270" font-size="14" fill="#68738a" font-weight="400" >Jeudi 22 octobre 2026</text><rect x="68" y="305" width="3" height="17" rx="0" fill="#b24450" stroke="#b24450"/><text x="81" y="318" font-size="13" fill="#b24450" font-weight="700" >EN RETARD</text><text x="640" y="318" font-size="11" fill="#68738a" font-weight="400" text-anchor="end">1 à faire</text><path d="M81 329 L640 329" stroke="#dce1eb"/><rect x="72" y="341" width="20" height="20" rx="4" fill="#f5f7fb" stroke="#8993a8"/><text x="106" y="357" font-size="15" fill="#293247" font-weight="400" >Envoyer la validation architecture</text><text x="106" y="379" font-size="11" fill="#b24450" font-weight="400" >#mission   ·   Échéance 21 oct.</text><rect x="68" y="414" width="3" height="17" rx="0" fill="#4e54a5" stroke="#4e54a5"/><text x="81" y="427" font-size="13" fill="#293247" font-weight="700" >EN COURS</text><text x="640" y="427" font-size="11" fill="#68738a" font-weight="400" text-anchor="end">4 à faire · 1 terminée</text><path d="M81 438 L640 438" stroke="#dce1eb"/><text x="81" y="456" font-size="11" fill="#68738a" font-weight="400" >Sans date prévue · prévu aujourd’hui ou auparavant.</text><rect x="65" y="463" width="579" height="57" rx="5" fill="#e7eaf9" stroke="#e7eaf9"/><rect x="65" y="464" width="3" height="55" rx="0" fill="#4e54a5" stroke="#4e54a5"/><rect x="72" y="473" width="20" height="20" rx="4" fill="#f5f7fb" stroke="#8993a8"/><text x="106" y="489" font-size="15" fill="#293247" font-weight="400" >Appeler le garage</text><rect x="615" y="472" width="26" height="26" rx="13" fill="#4e54a5" stroke="#4e54a5"/><text x="628" y="490" font-size="13" fill="white" font-weight="700" text-anchor="middle">1</text><rect x="72" y="532" width="20" height="20" rx="4" fill="#f5f7fb" stroke="#8993a8"/><text x="106" y="548" font-size="15" fill="#293247" font-weight="400" >Préparer le support de présentation</text><text x="106" y="570" font-size="11" fill="#68738a" font-weight="400" >#mission   ·   Prévu aujourd’hui   ·   Échéance 23 oct.</text><rect x="72" y="591" width="20" height="20" rx="4" fill="#f5f7fb" stroke="#8993a8"/><text x="106" y="607" font-size="15" fill="#293247" font-weight="400" >Reprendre le dossier assurance</text><text x="106" y="629" font-size="11" fill="#68738a" font-weight="400" >#perso   ·   Prévu le 20 oct.</text><rect x="615" y="590" width="26" height="26" rx="13" fill="#4e54a5" stroke="#4e54a5"/><text x="628" y="608" font-size="13" fill="white" font-weight="700" text-anchor="middle">2</text><rect x="72" y="650" width="20" height="20" rx="4" fill="#f5f7fb" stroke="#8993a8"/><text x="106" y="666" font-size="15" fill="#293247" font-weight="400" >Relire le contrat</text><text x="106" y="688" font-size="11" fill="#68738a" font-weight="400" >#client   ·   Échéance aujourd’hui</text><rect x="615" y="649" width="26" height="26" rx="13" fill="#4e54a5" stroke="#4e54a5"/><text x="628" y="667" font-size="13" fill="white" font-weight="700" text-anchor="middle">3</text><rect x="72" y="709" width="20" height="20" rx="4" fill="#4e54a5" stroke="#4e54a5"/><path d="M76 719 l4 4 8 -9" fill="none" stroke="white" stroke-width="2"/><text x="106" y="725" font-size="15" fill="#68738a" font-weight="400" text-decoration="line-through">Répondre à Paul</text><text x="106" y="747" font-size="11" fill="#68738a" font-weight="400" >Terminée aujourd’hui</text><rect x="68" y="772" width="3" height="17" rx="0" fill="#4e54a5" stroke="#4e54a5"/><text x="81" y="785" font-size="13" fill="#293247" font-weight="700" >PROCHAIN JOUR OUVRÉ · VEN. 23 OCT.</text><text x="640" y="785" font-size="11" fill="#68738a" font-weight="400" text-anchor="end">1 à faire</text><path d="M81 796 L640 796" stroke="#dce1eb"/><rect x="72" y="810" width="20" height="20" rx="4" fill="#f5f7fb" stroke="#8993a8"/><text x="106" y="826" font-size="15" fill="#293247" font-weight="400" >Préparer le comité</text><text x="106" y="848" font-size="11" fill="#68738a" font-weight="400" >#mission   ·   Échéance 26 oct.</text><rect x="68" y="870" width="3" height="17" rx="0" fill="#4e54a5" stroke="#4e54a5"/><text x="81" y="883" font-size="13" fill="#293247" font-weight="700" >PLUS TARD</text><text x="640" y="883" font-size="11" fill="#68738a" font-weight="400" text-anchor="end">2 à faire</text><path d="M81 894 L640 894" stroke="#dce1eb"/><rect x="72" y="908" width="20" height="20" rx="4" fill="#f5f7fb" stroke="#8993a8"/><text x="106" y="924" font-size="15" fill="#293247" font-weight="400" >Revoir la documentation ADR</text><text x="106" y="946" font-size="11" fill="#68738a" font-weight="400" >#fond   ·   Prévu le 26 oct.</text><rect x="72" y="961" width="20" height="20" rx="4" fill="#f5f7fb" stroke="#8993a8"/><text x="106" y="977" font-size="15" fill="#293247" font-weight="400" >Trier les archives</text><text x="106" y="999" font-size="11" fill="#68738a" font-weight="400" >#perso   ·   Prévu le 24 oct.</text><path d="M68 1015 L640 1015" stroke="#dce1eb"/><rect x="68" y="1026" width="194" height="36" rx="5" fill="#4e54a5" stroke="#4e54a5"/><text x="165.0" y="1050" font-size="13" fill="white" font-weight="600" text-anchor="middle">+ Ajouter une tâche</text><text x="284" y="1049" font-size="11" fill="#68738a" font-weight="400" >↑ ↓ naviguer · Espace cocher</text><text x="710" y="187" font-size="12" fill="#4e54a5" font-weight="700" letter-spacing="1">UN REGROUPEMENT AUTOMATIQUE</text><rect x="710" y="221" width="26" height="26" rx="13" fill="#4e54a5" stroke="#4e54a5"/><text x="723" y="239" font-size="13" fill="white" font-weight="700" text-anchor="middle">1</text><text x="750" y="240" font-size="18" fill="#293247" font-weight="700" >Visible dès la capture</text><text x="750" y="274" font-size="15" fill="#68738a" font-weight="400" >Un titre seul suffit. La tâche rejoint</text><text x="750" y="300" font-size="15" fill="#68738a" font-weight="400" >En cours, sans date à renseigner.</text><text x="750" y="326" font-size="15" fill="#68738a" font-weight="400" >La création ne lui attribue pas de date.</text><rect x="710" y="379" width="26" height="26" rx="13" fill="#4e54a5" stroke="#4e54a5"/><text x="723" y="397" font-size="13" fill="white" font-weight="700" text-anchor="middle">2</text><text x="750" y="398" font-size="18" fill="#293247" font-weight="700" >L’inachevé reste à portée de main</text><text x="750" y="432" font-size="15" fill="#68738a" font-weight="400" >Une tâche prévue mardi reste en cours</text><text x="750" y="458" font-size="15" fill="#68738a" font-weight="400" >jeudi tant qu’elle n’est pas terminée.</text><text x="750" y="484" font-size="15" fill="#68738a" font-weight="400" >La date initiale n’est pas réécrite.</text><rect x="710" y="537" width="26" height="26" rx="13" fill="#4e54a5" stroke="#4e54a5"/><text x="723" y="555" font-size="13" fill="white" font-weight="700" text-anchor="middle">3</text><text x="750" y="556" font-size="18" fill="#293247" font-weight="700" >La deadline ne planifie pas</text><text x="750" y="590" font-size="15" fill="#68738a" font-weight="400" >Sans date prévue, le contrat est en cours.</text><text x="750" y="616" font-size="15" fill="#68738a" font-weight="400" >Son échéance du jour est signalée.</text><text x="750" y="642" font-size="15" fill="#68738a" font-weight="400" >Demain, s’il est inachevé : En retard.</text><rect x="710" y="700" width="600" height="135" rx="8" fill="#e7eaf9" stroke="#d7ddef"/><text x="730" y="732" font-size="18" fill="#293247" font-weight="700" >Le retard reste prioritaire</text><text x="730" y="766" font-size="15" fill="#68738a" font-weight="400" >Une deadline dépassée place la tâche dans En retard,</text><text x="730" y="791" font-size="15" fill="#68738a" font-weight="400" >même sans date prévue. Une tâche n’apparaît</text><text x="730" y="816" font-size="15" fill="#68738a" font-weight="400" >jamais dans deux sections.</text><rect x="710" y="865" width="600" height="133" rx="8" fill="#f5f7fb" stroke="#dce1eb"/><text x="730" y="897" font-size="18" fill="#293247" font-weight="700" >Règles de classement retenues</text><text x="730" y="930" font-size="15" fill="#68738a" font-weight="400" >« En cours » désigne ici une section de la liste.</text><text x="730" y="955" font-size="15" fill="#68738a" font-weight="400" >Les états restent À faire / Terminée.</text><text x="730" y="980" font-size="15" fill="#68738a" font-weight="400" >Une date future reporte la tâche vers la suite.</text><text x="44" y="1118" font-size="12" fill="#68738a" font-weight="400" >Maquette fonctionnelle validée le 22 octobre 2026 · exemples fictifs · ouvrir index.html pour tester les parcours.</text></g></svg>