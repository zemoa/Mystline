<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160"><rect width="1440" height="1160" fill="#edf0f5"/><g font-family="DejaVu Sans, sans-serif"><text x="44" y="40" font-size="12" fill="#4e54a5" font-weight="700" letter-spacing="1.4">MYSTLINE / MAQUETTE 02 / DIRECTION FONCTIONNELLE VALIDÉE</text><text x="44" y="84" font-size="30" fill="#293247" font-weight="700" >Capturer, planifier, reprendre le lendemain.</text><text x="44" y="117" font-size="16" fill="#68738a" font-weight="400" >Les mêmes tâches changent de section selon leur date prévue, leur deadline et la date du jour.</text><text x="44" y="164" font-size="13" fill="#4e54a5" font-weight="700" >01 / CAPTURER SANS DATE</text><rect x="44" y="185" width="650" height="210" rx="8" fill="#f5f7fb" stroke="#dce1eb"/><text x="66" y="219" font-size="12" fill="#68738a" font-weight="700" letter-spacing="1">CAPTURE RAPIDE</text><rect x="66" y="239" width="606" height="54" rx="6" fill="white" stroke="#4e54a5"/><text x="82" y="273" font-size="18" fill="#293247" font-weight="400" >Acheter des piles</text><text x="66" y="325" font-size="12" fill="#68738a" font-weight="400" >Entrée ajouter · Échap fermer · F1 aide</text><text x="66" y="363" font-size="14" fill="#68738a" font-weight="400" >Aucun choix de date ou de statut.</text><rect x="44" y="418" width="650" height="101" rx="8" fill="#e7eaf9" stroke="#d7ddef"/><text x="64" y="450" font-size="14" fill="#4e54a5" font-weight="700" >Après Entrée → EN COURS</text><rect x="64" y="466" width="20" height="20" rx="4" fill="#f5f7fb" stroke="#8993a8"/><text x="98" y="482" font-size="15" fill="#293247" font-weight="400" >Acheter des piles</text><text x="44" y="571" font-size="13" fill="#4e54a5" font-weight="700" >02 / REPORTER OU RETIRER LA DATE</text><rect x="44" y="592" width="650" height="276" rx="8" fill="#f5f7fb" stroke="#dce1eb"/><text x="66" y="627" font-size="18" fill="#293247" font-weight="700" >Modifier la tâche</text><rect x="66" y="648" width="606" height="53" rx="6" fill="white" stroke="#4e54a5"/><text x="80" y="681" font-size="17" fill="#293247" font-weight="400" >Appeler le garage /p vendredi</text><text x="66" y="731" font-size="12" fill="#68738a" font-weight="400" >/p date prévue · /d deadline · #tag</text><text x="66" y="754" font-size="12" fill="#68738a" font-weight="400" >Entrée enregistrer · Échap annuler · F1 aide</text><rect x="412" y="798" width="110" height="36" rx="5" fill="#ffffff" stroke="#dce1eb"/><text x="467.0" y="822" font-size="13" fill="#293247" font-weight="600" text-anchor="middle">Annuler</text><rect x="534" y="798" width="138" height="36" rx="5" fill="#4e54a5" stroke="#4e54a5"/><text x="603.0" y="822" font-size="13" fill="white" font-weight="600" text-anchor="middle">Enregistrer</text><rect x="44" y="891" width="650" height="140" rx="8" fill="#e7eaf9" stroke="#d7ddef"/><text x="64" y="925" font-size="16" fill="#4e54a5" font-weight="700" >Après enregistrement</text><text x="64" y="958" font-size="15" fill="#68738a" font-weight="400" >En cours → Prochain jour ouvré · vendredi 23 octobre</text><text x="64" y="984" font-size="15" fill="#68738a" font-weight="400" >Retirer /p vendredi → retour dans En cours</text><text x="64" y="1010" font-size="15" fill="#68738a" font-weight="400" >La tâche apparaît une seule fois.</text><text x="770" y="164" font-size="13" fill="#4e54a5" font-weight="700" >03 / VENDREDI : LE QUOTIDIEN ÉVOLUE</text><rect x="770" y="185" width="626" height="865" rx="8" fill="#f5f7fb" stroke="#dce1eb"/><text x="794" y="222" font-size="24" fill="#4e54a5" font-weight="700" >☰</text><text x="829" y="221" font-size="18" fill="#293247" font-weight="650" >Mystline</text><text x="1156" y="220" font-size="12" fill="#68738a" font-weight="400" >Recherche   Historique   Aide</text><text x="794" y="268" font-size="28" fill="#293247" font-weight="700" >Mes tâches</text><text x="794" y="295" font-size="14" fill="#68738a" font-weight="400" >Vendredi 23 octobre 2026</text><rect x="7