 >La vue du vendredi repart des exemples initiaux : le report du garage est un parcours indépendant.</text><text x="44" y="1108" font-size="14" fill="#68738a" font-weight="400" >Règles retenues : sans date prévue = en cours ; dates passées maintenues en cours ; retard prioritaire.</text></g></svg>